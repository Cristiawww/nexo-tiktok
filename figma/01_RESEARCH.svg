<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1440 900" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FAF9F5" height="900" width="1440" x="0" y="0" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3px" x="72" y="65">NEXO</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2px" text-anchor="end" x="1368" y="65">INVESTIGACIÓN / 01</text><line stroke="#DCE6DE" stroke-width="1" x1="72" x2="1368" y1="84" y2="84" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="48" font-weight="700" x="72" y="149">Elegir a quién contratar</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="19" x="72" y="186">La pregunta correcta no es quién tiene más seguidores, sino quién encaja mejor con el producto.</text><rect fill="#102E34" height="260" rx="8" ry="8" width="615" x="72" y="225" /><text fill="#91DCC4" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2px" x="100" y="265">PROBLEMA</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="100" y="317">Un negocio local quiere anunciar</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="100" y="357">accesorios de ciclismo, pero</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="100" y="397">no sabe qué creador elegir.</text><text fill="#A4DCC8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1px" x="100" y="453">DECISIÓN: COLABORAR / NO COLABORAR</text><rect fill="#FFFFFF" height="260" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="656" x="712" y="225" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5px" x="742" y="265">HIPÓTESIS DE PRODUCTO</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="25" x="742" y="314">Revisar publicaciones recientes y</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="25" x="742" y="355">comentarios permite una selección</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="25" x="742" y="396">más defendible que contar seguidores.</text><rect fill="#E8F6EB" height="31" rx="15" ry="15" width="300" x="742" y="429" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="13" font-weight="700" x="756" y="450">HIPÓTESIS PENDIENTE DE VALIDAR</text><rect fill="#FFFFFF" height="248" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="302" x="72" y="523" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="94" y="561">01</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="24" font-weight="700" x="94" y="607">Captura</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="16" x="94" y="642">Hasta cinco perfiles públicos</text><line stroke="#DCE6DE" stroke-width="1" x1="94" x2="350" y1="683" y2="683" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7px" x="94" y="716">PROCESO DE RESEARCH</text><rect fill="#FFFFFF" height="248" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="302" x="399" y="523" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="421" y="561">02</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="24" font-weight="700" x="421" y="607">Comparación</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="16" x="421" y="642">Diez videos visibles por cuenta</text><line stroke="#DCE6DE" stroke-width="1" x1="421" x2="677" y1="683" y2="683" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7px" x="421" y="716">PROCESO DE RESEARCH</text><rect fill="#FFFFFF" height="248" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="302" x="726" y="523" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="748" y="561">03</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="24" font-weight="700" x="748" y="607">Patrones</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="16" x="748" y="642">Vistas, interacción, preguntas</text><line stroke="#DCE6DE" stroke-width="1" x1="748" x2="1004" y1="683" y2="683" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7px" x="748" y="716">PROCESO DE RESEARCH</text><rect fill="#FFFFFF" height="248" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="302" x="1053" y="523" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="28" font-weight="700" x="1075" y="561">04</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="24" font-weight="700" x="1075" y="607">Resultado</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="16" x="1075" y="642">Candidata y evidencia disponible</text><line stroke="#DCE6DE" stroke-width="1" x1="1075" x2="1331" y1="683" y2="683" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7px" x="1075" y="716">PROCESO DE RESEARCH</text><line stroke="#DCE6DE" stroke-width="1" x1="72" x2="1368" y1="847" y2="847" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2px" x="72" y="873">NEXO  /  INVESTIGACIÓN + PRODUCTO</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" text-anchor="end" x="1368" y="873">01 / 08</text></svg>