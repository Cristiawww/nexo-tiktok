<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1440 900" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FAF9F5" height="900" width="1440" x="0" y="0" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3px" x="72" y="65">NEXO</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2px" text-anchor="end" x="1368" y="65">INVESTIGACIÓN / 02</text><line stroke="#DCE6DE" stroke-width="1" x1="72" x2="1368" y1="84" y2="84" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="48" font-weight="700" x="72" y="149">Cómo se toma la decisión</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="19" x="72" y="186">Métricas comparables sobre publicaciones, no popularidad histórica del perfil.</text><rect fill="#FFFFFF" height="195" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="242" x="72" y="229" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="21" font-weight="700" x="91" y="271">Afinidad</text><text fill="#006F63" font-family="Arial, sans-serif" font-size="38" font-weight="700" x="91" y="320">35 %</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="91" y="357">Tema en biografía y descripciones</text><rect fill="#FFFFFF" height="195" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="242" x="333" y="229" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="21" font-weight="700" x="352" y="271">Alcance</text><text fill="#006F63" font-family="Arial, sans-serif" font-size="38" font-weight="700" x="352" y="320">25 %</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="352" y="357">Mediana de vistas</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="352" y="377">por video</text><rect fill="#FFFFFF" height="195" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="242" x="594" y="229" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="21" font-weight="700" x="613" y="271">Interacción</text><text fill="#006F63" font-family="Arial, sans-serif" font-size="38" font-weight="700" x="613" y="320">20 %</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="613" y="357">Likes / vistas</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="613" y="377">por publicación</text><rect fill="#FFFFFF" height="195" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="242" x="855" y="229" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="21" font-weight="700" x="874" y="271">Conversación</text><text fill="#006F63" font-family="Arial, sans-serif" font-size="38" font-weight="700" x="874" y="320">10 %</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="874" y="357">Comentarios / vistas disponibles</text><rect fill="#FFFFFF" height="195" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="242" x="1116" y="229" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="21" font-weight="700" x="1135" y="271">Cobertura</text><text fill="#006F63" font-family="Arial, sans-serif" font-size="38" font-weight="700" x="1135" y="320">10 %</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="14" x="1135" y="357">Videos con cifras comparables</text><rect fill="#102E34" height="301" rx="8" ry="8" width="632" x="72" y="456" /><text fill="#9DDFC4" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6px" x="102" y="501">PATRONES A MEDIR</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" x="102" y="555">•  ¿Qué temas aparecen en cada publicación?</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" x="102" y="601">•  ¿Las vistas son constantes o irregulares?</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" x="102" y="647">•  ¿La audiencia comenta o solo visualiza?</text><text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" x="102" y="693">•  ¿Qué preguntas se repiten?</text><rect fill="#FFFFFF" height="301" rx="8" ry="8" stroke="#DCE6DE" stroke-width="1" width="637" x="731" y="456" /><text fill="#006F63" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5px" x="763" y="501">REGLA DE EVIDENCIA</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="20" x="763" y="559">Sin vistas y likes de al menos tres videos,</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="20" x="763" y="595">una cuenta no recibe puntuación comercial.</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="20" x="763" y="631" /><text fill="#152E33" font-family="Arial, sans-serif" font-size="20" x="763" y="667">El ranking nunca predice ventas.</text><text fill="#152E33" font-family="Arial, sans-serif" font-size="20" x="763" y="703">Las cuentas sin datos siguen visibles.</text><line stroke="#DCE6DE" stroke-width="1" x1="72" x2="1368" y1="847" y2="847" /><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2px" x="72" y="873">NEXO  /  INVESTIGACIÓN + PRODUCTO</text><text fill="#657A72" font-family="Arial, sans-serif" font-size="12" text-anchor="end" x="1368" y="873">02 / 08</text></svg>